# A single-service deployment for the Atlas. The data directory is a named volume
# so the database survives container restarts. Set the write tokens in a .env file
# beside this one before bringing it up.

services:
  atlas:
    build: .
    image: senselex:0.2.0
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      SENSELEX_HOST: 0.0.0.0
      SENSELEX_DATABASE_PATH: /app/data/senselex.db
      SENSELEX_API_TOKENS: ${SENSELEX_API_TOKENS}
      SENSELEX_CORS_ORIGINS: ${SENSELEX_CORS_ORIGINS:-}
      SENSELEX_AUDIT_SECRET: ${SENSELEX_AUDIT_SECRET:-}
      SENSELEX_MAX_BODY_BYTES: ${SENSELEX_MAX_BODY_BYTES:-1000000}
      SENSELEX_MAX_PAGE_SIZE: ${SENSELEX_MAX_PAGE_SIZE:-200}
      SENSELEX_RATE_WINDOW_MS: ${SENSELEX_RATE_WINDOW_MS:-60000}
      SENSELEX_RATE_MAX: ${SENSELEX_RATE_MAX:-240}
    volumes:
      - atlas-data:/app/data

volumes:
  atlas-data:
